name: Deploy to Vercel Production

on:
  push:
    branches:
      - main
      - develop

env:
  VERCEL_ORG_ID: team_NhegmBSpQwSLRzjvshDUlR0B
  VERCEL_PROJECT_ID: prj_qJdZBptjCEZgDWEki4JYCKKWAqxC

jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate VERCEL_TOKEN Secret
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN is not set in GitHub repository secrets! Please generate a token at https://vercel.com/account/tokens and add it to GitHub Settings -> Secrets and variables -> Actions -> VERCEL_TOKEN"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: watoto-website/package-lock.json

      - name: Install Dependencies
        working-directory: watoto-website
        run: npm ci || npm install

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Configuration
        working-directory: watoto-website
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project
        working-directory: watoto-website
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Production
        working-directory: watoto-website
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
